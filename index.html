:root{
  --green:#0f766e;
  --green-d:#0b5c54;
  --green-l:#14b8a6;
  --bg:#f4f7f5;
  --card:#fff;
  --line:#e2e8e4;
  --muted:#64748b;
  --accent:#ccfbf1;
  --warn:#c2410c;
  --warnbg:#fff1e8;
  --danger:#b91c1c;
  --dangerbg:#fee2e2;
  --info:#1e40af;
  --infobg:#dbeafe;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);font-family:'Plus Jakarta Sans',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;}
header{position:sticky;top:0;z-index:30;background:var(--green);color:#fff;padding:10px 12px 8px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.htop{display:flex;align-items:center;gap:8px;}
.htop h1{font-size:16px;margin:0;font-weight:700;flex:1;line-height:1.2;}
.htop .count{font-size:12px;opacity:.9;background:rgba(255,255,255,.18);padding:3px 8px;border-radius:20px;white-space:nowrap;}
.searchbar{margin-top:8px;display:flex;gap:6px;}
.searchbar input{flex:1;border:none;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;}
.filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.filters select,.chip{font-size:12.5px;border:none;border-radius:8px;padding:7px 9px;background:rgba(255,255,255,.16);color:#fff;outline:none;}
.filters select option{color:#000;}
.chip{cursor:pointer;display:inline-flex;align-items:center;gap:4px;user-select:none;}
.chip.on{background:#ffd166;color:#5a3b00;font-weight:700;}
.toolbar{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:25;}
.btn{border:1px solid var(--line);background:#fff;color:var(--green-d);font-size:13px;font-weight:600;border-radius:9px;padding:8px 11px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s ease;}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green);}
.btn.tab.on{background:var(--green);color:#fff;border-color:var(--green);}
.btn:active{transform:scale(.97);}

/* Submenu PhÃ²ng */
.room-subnav{background:#f8faf9;border-bottom:1px solid var(--line);padding:7px 12px;display:flex;flex-direction:column;gap:6px;}
.room-subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;}
.room-subtabs::-webkit-scrollbar{display:none;}
.sbtn{border:1px solid var(--line);background:#fff;color:#334155;font-size:12.5px;font-weight:600;border-radius:8px;padding:6px 10px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.sbtn.on{background:var(--green-d);color:#fff;border-color:var(--green-d);}
.sbtn .sbadge{font-size:11px;background:#e2e8f0;color:#1e293b;padding:1px 6px;border-radius:12px;font-weight:700;}
.sbtn.on .sbadge{background:rgba(255,255,255,.25);color:#fff;}
.sbtn .sbadge.warn{background:#fef3c7;color:#b45309;}
.sbtn.on .sbadge.warn{background:#b45309;color:#fff;}

.alert-subfilters{display:flex;gap:5px;overflow-x:auto;padding-top:2px;scrollbar-width:none;}
.alert-subfilters::-webkit-scrollbar{display:none;}
.afchip{font-size:11.5px;padding:4px 8px;border-radius:6px;background:#fff;border:1px solid #cbd5e1;color:#475569;cursor:pointer;white-space:nowrap;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
.afchip.on{background:#fff1e8;border-color:#f97316;color:#c2410c;}

.roomhdr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:2px 2px 10px;}
.occ{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);}
.occ .onm{flex:1;font-size:14.5px;font-weight:600;}
.occ .mini-b{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--green-d);font-weight:600;cursor:pointer;}
.occ .mini-b.move{background:var(--green);color:#fff;border-color:var(--green);}
#list{padding:10px 10px 80px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:border-color .15s;}
.card:active{background:#fafdfb;}
.card.card-alert{border-left:4px solid #f97316;}
.card.card-danger{border-left:4px solid #ef4444;}
.card.card-empty{border-style:dashed;background:#fafbfc;}
.card .nm{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5;}

.tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--accent);color:var(--green-d);display:inline-flex;align-items:center;gap:3px;}
.tag.gt{background:#eef2ff;color:#3949ab;}
.tag.kh{background:#f3f4f6;color:#555;}
.tag.muon{background:var(--warnbg);color:var(--warn);}
.tag.edited{background:#fef9c3;color:#854d0e;}
.tag.chu{background:#fff7e0;color:#9a6b00;}
.tag.alert-tag{background:#fff1e8;color:#c2410c;border:0.5px solid #fdba74;}
.tag.danger-tag{background:#fee2e2;color:#b91c1c;border:0.5px solid #fca5a5;}
.tag.empty-tag{background:#f1f5f9;color:#64748b;}

.pill{display:inline-flex;align-items:center;gap:3px;background:#f1f5f3;border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0;font-size:12px;color:#334155;text-decoration:none;}
.pill.phone-pill{background:#ecfdf5;color:#047857;font-weight:700;border:1px solid #a7f3d0;}
.pill.phone-pill:hover{background:#d1fae5;text-decoration:underline;}

.room-alert-box{background:#fff7ed;border:1px solid #ffedd5;border-left:4px solid #f97316;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12px;color:#9a3412;}
.room-alert-box.danger{background:#fef2f2;border-color:#fee2e2;border-left-color:#ef4444;color:#991b1b;}
.room-alert-box ul{margin:3px 0 0 16px;padding:0;}
.room-alert-box li{margin-bottom:2px;}

.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;overflow-y:auto;animation:up .2s ease;}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-h{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:8px;padding:14px 14px 10px;border-bottom:1px solid var(--line);z-index:10;}
.sheet-h h2{font-size:16px;margin:0;flex:1;}
.sheet-b{padding:12px 14px 16px;}
.fld{margin-bottom:11px;}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px;}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:14.5px;outline:none;background:#fff;font-family:inherit;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--green);}
.fld-phone-wrap{display:flex;gap:6px;align-items:center;}
.fld-phone-wrap input{flex:1;}
.fld-phone-wrap .mini-b{height:40px;padding:0 12px;white-space:nowrap;}

.row2{display:flex;gap:9px;}.row2>div{flex:1;}
.muon-note{font-size:11.5px;color:var(--warn);margin-top:-4px;}
.sheet-f{position:sticky;bottom:0;background:#fff;display:flex;gap:8px;padding:11px 14px;border-top:1px solid var(--line);z-index:10;}
.sheet-f .btn{flex:1;justify-content:center;padding:12px;font-size:14.5px;}
.btn.del{color:#b91c1c;border-color:#fca5a5;background:#fff;flex:0 0 auto;}
.x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;padding:0 4px;}
.fab{position:fixed;right:16px;bottom:18px;z-index:40;background:var(--green);color:#fff;border:none;width:56px;height:56px;border-radius:50%;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:.95;}

.statbox{padding:14px;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px;}
.stat{background:var(--accent);border-radius:11px;padding:12px;}
.stat.stat-warn{background:#fff1e8;border:1px solid #fed7aa;}
.stat.stat-warn b{color:#c2410c;}
.stat b{font-size:22px;color:var(--green-d);display:block;}
.stat span{font-size:12px;color:var(--muted);}
table.mini{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:12px;}
table.mini td{padding:6px 4px;border-bottom:1px solid var(--line);}
table.mini td:last-child{text-align:right;font-weight:700;color:var(--green-d);}
.clickable-row{cursor:pointer;}
.clickable-row:hover{background:#f8faf9;}

.avatar{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:0 0 auto;background:#e7eee9;border:1px solid var(--line);}
.cardrow{display:flex;gap:10px;align-items:flex-start;}
.cardrow .cbody{flex:1;min-width:0;}
.islot{margin-bottom:12px;}
.ilabel{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;}
.thumbimg{width:100%;max-height:240px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#f7f9f8;display:block;}
.noimg{height:90px;border:1.5px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;background:#fafdfb;}
.ibtns{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap;}
.ibtns .mini-b{display:inline-flex;align-items:center;gap:4px;}
.vnbox{background:var(--accent);border-radius:11px;padding:10px 12px;margin:4px 0 14px;}
.vnbox .vntitle{font-size:12.5px;font-weight:700;color:var(--green-d);margin-bottom:6px;}
.dv{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:4px 0;border-bottom:1px dotted #cfe0d6;}
.dv:last-child{border-bottom:none;}
